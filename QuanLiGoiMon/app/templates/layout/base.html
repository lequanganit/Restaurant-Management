<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trang chủ{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

{% block header %}
{% include 'layout/header.html' %}
{% endblock %}

<section class="container content-wrapper">
    {% block content %}
    {% endblock %}
</section>

{% block footer %}
{% include 'layout/footer.html' %}
{% endblock %}

<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="liveToast" class="toast fade" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="toast-title">Thông báo</strong>
            <small class="text-muted">vừa xong</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-body">
            Nội dung
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/toast.js') }}"></script>

</body>
<link rel="stylesheet" href="{{ url_for('static', filename='style/styles.css') }}">
</html>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% extends "layout/base.html" %}

{% block title %}Phục vụ{% endblock %}

{% block content %}
<form class="d-flex pt-3 w-50" method="get" action="/waiter">
    <input class="form-control me-2" type="text" placeholder="Tìm kiếm ..." name="kw">
    <button class="btn btn-primary" type="submit">Tìm</button>
</form>
<section>
    <div class="row">
        {% for t in table %}
            <div class="col-md-3 col-6 p-3">
                <div class="card">
                  <img class="card-img-top" src="{{t.image}}" alt="{{t.name}}">
                  <div class="card-body">
                    <h4 class="card-title">{{t.name}}</h4>
                    <p class="card-text">Status: {{t.status.value}}</p>
                    <a href="{{ url_for('order', table_id=t.id) }}" class="btn btn-danger">Order</a>
                  </div>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
